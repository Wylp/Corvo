name: Corvo
options:
  bundleIdPrefix: com.wylp
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.11.1

targets:
  Corvo:
    type: application
    platform: macOS
    sources:
      - Sources/Corvo
    dependencies:
      - package: GRDB
        product: GRDB
    info:
      path: Corvo-Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        NSHumanReadableCopyright: MIT
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wylp.corvo
        PRODUCT_NAME: Corvo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        # Without this the compiler extracts no literals and the String Catalog
        # never learns about them — the whole convention from task 10 is a no-op.
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
      configs:
        # Xcode injects `com.apple.security.get-task-allow` into the base
        # entitlements unless a configuration says otherwise, and Release was
        # inheriting it. That entitlement authorises `task_for_pid()`: any
        # process running as the same user could attach a debugger and read
        # Corvo's memory — which by construction holds every clipping just
        # captured, in the clear — with no TCC prompt and no password. It is
        # also the exact protection ENABLE_HARDENED_RUNTIME above is bought for,
        # so leaving both on shipped an app that only looked hardened.
        #
        # Debug is deliberately left alone: development needs the debugger.
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  CorvoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/CorvoTests
    dependencies:
      - target: Corvo
      - package: GRDB
        product: GRDB
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Corvo:
    build:
      targets:
        Corvo: all
        CorvoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CorvoTests
